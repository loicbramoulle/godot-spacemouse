<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">SpaceMouse Bridge for Godot</title>
  <desc id="desc">A six-axis controller puck with two clean circular motion arrows.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26324a"/>
      <stop offset="1" stop-color="#101624"/>
    </linearGradient>
    <linearGradient id="puck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#94a8c8"/>
      <stop offset="1" stop-color="#41536f"/>
    </linearGradient>
    <marker id="arrow-cyan" markerWidth="22" markerHeight="22" refX="18" refY="11" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 2 20 11 0 20Z" fill="#62d2ff"/>
    </marker>
    <marker id="arrow-green" markerWidth="22" markerHeight="22" refX="18" refY="11" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 2 20 11 0 20Z" fill="#8ee36b"/>
    </marker>
  </defs>
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>
  <path d="M42 128A86 86 0 0 1 190 69" fill="none" stroke="#62d2ff" stroke-width="11" stroke-linecap="round" marker-end="url(#arrow-cyan)"/>
  <path d="M214 136A86 86 0 0 1 66 195" fill="none" stroke="#8ee36b" stroke-width="11" stroke-linecap="round" marker-end="url(#arrow-green)"/>
  <ellipse cx="132" cy="159" rx="57" ry="27" fill="#243147" stroke="#b7c8df" stroke-width="5"/>
  <path d="M91 157v-49c0-21 18-38 41-38s41 17 41 38v49c0 14-18 25-41 25s-41-11-41-25Z" fill="url(#puck)" stroke="#d5e2f4" stroke-width="6"/>
  <ellipse cx="132" cy="108" rx="41" ry="27" fill="#7f95b7" stroke="#d5e2f4" stroke-width="6"/>
  <circle cx="132" cy="108" r="9" fill="#62d2ff"/>
</svg>
